name: lint
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  awesome-lint:
    strategy:
      fail-fast: false
      matrix:
        files:
          - "README.md"
    runs-on: ubuntu-latest
    steps:
      - name: "checkout repo"
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: asdf_install
        uses: asdf-vm/actions/install@b7bcd026f18772e44fe1026d729e1611cc435d47 # v4.0.1
      - name: "linting: ${{ matrix.files }}"
        run: npx -y awesome-lint ${{ matrix.files }}
  awesome-bot:
    strategy:
      fail-fast: false
      matrix:
        files:
          - "README.md"
    runs-on: ubuntu-latest
    steps:
      - name: "checkout repo"
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: "setup ruby"
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "3.0"
          bundler: 2.5.5
          bundler-cache: true
      - name: "install awesome-bot"
        run: gem install awesome_bot
      - name: "linting: ${{ matrix.files }}"
        run: awesome_bot --allow 403 --allow 429 --allow-redirect --allow-dupe ${{ matrix.files }}
